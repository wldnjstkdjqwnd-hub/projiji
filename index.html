<script>
const CATS=['전체','캐릭터','일러스트','굿즈디자인','AI 제작','디지털 드로잉'];
let W = [];
let settings={siteTitle:'AI 융합 디지털 드로잉 & 굿즈 제작 클래스',eyebrow:'온라인 작품 전시회',heading:'어린이들의 창작물을\n하나의 전시회로 만나요',lead:'학생들이 직접 상상하고 그린 작품을 한자리에서 감상해 보세요.',introTitle:'전시 소개',intro1:'교육 프로그램의 목적과 학생들의 창작 활동을 소개하는 자리입니다.',intro2:'상상 속 캐릭터를 직접 그리고, 디지털 도구와 AI를 함께 써 보며 하나의 작품으로 완성하는 과정을 담았습니다.',bg:'#FBF6EC',accent:'#D9772B',ink:'#3B2F2A',banner:''};

function art(h=200){
 const s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><rect width="400" height="300" fill="hsl(${h},65%,88%)"/><circle cx="70" cy="60" r="50" fill="hsl(${h+30},70%,80%)"/><circle cx="340" cy="250" r="70" fill="hsl(${h-30},60%,78%)"/><ellipse cx="200" cy="175" rx="95" ry="85" fill="hsl(${h+10},75%,96%)"/><circle cx="165" cy="165" r="9" fill="#3B2F2A"/><circle cx="235" cy="165" r="9" fill="#3B2F2A"/><ellipse cx="148" cy="190" rx="14" ry="8" fill="hsl(${h+330},80%,80%)"/><ellipse cx="252" cy="190" rx="14" ry="8" fill="hsl(${h+330},80%,80%)"/><path d="M185 195q15 14 30 0" stroke="#3B2F2A" stroke-width="5" fill="none" stroke-linecap="round"/><text x="12" y="288" font-size="14" fill="#3B2F2A" opacity=".6" font-family="sans-serif">예시 이미지</text></svg>`;
 return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
}
const E=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=(w)=>`<img src="${w.image_url || art()}" alt="${E(w.title)}" loading="lazy" onerror="this.outerHTML='<span class=&quot;fallback&quot;>이미지를 불러오지 못했어요</span>'">`;

let cat='전체',q='',view='home';
const app=document.getElementById('app');
const tagsOf=w=>[w.category].filter(Boolean);
const list=()=>W.filter(w=>(cat==='전체'||tagsOf(w).includes(cat))&&(!q||((w.title||'')+(w.artist_name||'')).includes(q.trim())));

async function fetchWorks() {
  const { data, error } = await _supabase.from('works').select('*').order('created_at', { ascending: false });
  if (error) {
    console.error('Supabase 데이터 가져오기 실패:', error);
  } else {
    W = data || [];
    if(view === 'home') home();
  }
}

function applySettings(){
  document.title=settings.siteTitle;
  const logoEl = document.getElementById('logo');
  if(logoEl) logoEl.textContent=settings.siteTitle;
  document.documentElement.style.setProperty('--bg',settings.bg);
  document.documentElement.style.setProperty('--accent',settings.accent);
  document.documentElement.style.setProperty('--ink',settings.ink);
}

function home(){
 const mosaicImgs = W.slice(0, 5).map(w => img(w)).join('');
 app.innerHTML=`<div id="top" class="hero"><div class="wrap"><div><p class="eyebrow">${E(settings.eyebrow)}</p><h1>${E(settings.heading).replace(/\n/g,"<br>")}</h1><p class="lead">${E(settings.lead)}</p><button class="btn" data-go="gallery">작품 감상하기</button></div><div class="mosaic">${mosaicImgs || '등록된 작품이 없습니다.'}</div></div></div>
 <section id="intro" class="intro"><div class="wrap"><h2>${E(settings.introTitle)}</h2><p>${E(settings.intro1)}</p><p>${E(settings.intro2)}</p></div></section>
 <section id="gallery"><div class="wrap"><h2>작품 갤러리</h2><div class="tools"><input class="search" id="q" type="search" placeholder="작품명 또는 작가명으로 검색" value="${E(q)}" aria-label="작품 검색"><div class="chips" id="chips"></div></div><div id="res"></div></div></section>
 <footer id="info"><div class="wrap"><p style="font-size:16px;margin:0 0 20px">학생들의 창작을 따뜻하게 응원해 주세요.</p><div class="cols"><div><h4>전시 안내</h4><p>작품은 전시 목적으로만 공개됩니다.</p></div><div><h4>개인정보 안내</h4><p>실명 대신 공개용 이름을 사용합니다.</p></div><div><h4>운영 정보</h4><p>온라인 전시관 시스템</p></div></div></div></footer>`;
 draw();
}

function draw(){
 const chipsEl = document.getElementById('chips');
 if(chipsEl) chipsEl.innerHTML=CATS.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-cat="${c}">${c}</button>`).join('');
 const l=list();
 const resEl = document.getElementById('res');
 if(resEl) resEl.innerHTML=l.length?`<div class="grid">${l.map(w=>`<button class="card" data-id="${w.id}"><span class="thumb">${img(w)}</span><h3>${E(w.title)}</h3><small>${E(w.artist_name)}</small><span class="tag">${E(w.category)}</span></button>`).join('')}</div>`:'<div class="empty">등록된 작품이 없거나 조건에 맞는 작품이 없어요.</div>';
}

function detail(id){
 const w = W.find(item => item.id == id);
 if(!w) return;
 view='detail';
 app.innerHTML=`<div class="detail"><div class="wrap"><button class="back" id="back">← 전체 작품 목록</button><div class="stage">${img(w)}<button class="zoom" id="zoom">확대해서 보기</button></div><h1 style="font-size:28px">${E(w.title)}</h1><p class="lead" style="margin-bottom:24px">${E(w.artist_name)}</p><div class="meta"><div><h4>작품 설명</h4><p>${E(w.description)}</p><h4>창작 의도</h4><p>${E(w.intention)}</p></div><div><h4>분류</h4><p>${tagsOf(w).map(E).join(', ')}</p><h4>제작 도구 및 재료</h4><p>${E(w.tools)}</p></div></div></div></div>`;
 window.scrollTo(0,0);
 
 const backBtn = document.getElementById('back');
 if(backBtn) backBtn.onclick=()=>{view='home';home();go('gallery')};
 
 const zoomBtn = document.getElementById('zoom');
 const stageImg = document.querySelector('.stage img');
 const zoomIt=()=>lb(w);
 if(zoomBtn) zoomBtn.onclick=zoomIt;
 if(stageImg) stageImg.onclick=zoomIt;
}

function lb(w){
 const b=document.getElementById('lb');
 const lbi=document.getElementById('lbi');
 if(lbi){ lbi.src=w.image_url||art(); lbi.alt=w.title; }
 if(b){ b.classList.remove('big'); b.classList.add('on'); }
}

function go(k){
 if(view==='detail'){view='home';home()}
 const targetEl = document.getElementById(k==='top'?'top':k==='gallery'?'gallery':'info');
 if(targetEl) targetEl.scrollIntoView({behavior:'smooth'});
}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-cat],[data-id]');
 if(!t) return;
 if(t.dataset.go)go(t.dataset.go);
 else if(t.dataset.cat){cat=t.dataset.cat;draw()}
 else if(t.dataset.id)detail(t.dataset.id);
});

document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;draw()}});

const logoBtn = document.getElementById('logo');
if(logoBtn) logoBtn.onclick=()=>{view='home';home();scrollTo(0,0)};

const L=document.getElementById('lb');
const lbxBtn=document.getElementById('lbx');
const lbiImg=document.getElementById('lbi');
if(lbxBtn && L) lbxBtn.onclick=()=>L.classList.remove('on');
if(lbiImg && L) lbiImg.onclick=()=>L.classList.toggle('big');

const adminLoginBox=document.getElementById('adminLoginBox');
function adminLogin(){
  const errEl = document.getElementById('adminLoginError');
  const pwEl = document.getElementById('adminPassword');
  if(errEl) errEl.style.display='none';
  if(pwEl) pwEl.value='';
  if(adminLoginBox) adminLoginBox.style.display='flex';
}
function closeAdminLogin(){ if(adminLoginBox) adminLoginBox.style.display='none'; }

const adminOpenBtn = document.getElementById('adminOpen');
const adminCancelBtn = document.getElementById('adminCancel');
const adminLoginForm = document.getElementById('adminLoginForm');

if(adminOpenBtn) adminOpenBtn.addEventListener('click',adminLogin);
if(adminCancelBtn) adminCancelBtn.addEventListener('click',closeAdminLogin);
if(adminLoginForm) {
  adminLoginForm.addEventListener('submit',e=>{
    e.preventDefault();
    const pwInput = document.getElementById('adminPassword');
    const errEl = document.getElementById('adminLoginError');
    if(pwInput && pwInput.value==='20161020'){
      closeAdminLogin();
      adminPage();
    }else if(errEl){
      errEl.style.display='block';
    }
  });
}

function adminPage(){
 view='admin';
 app.innerHTML=`<section><div class="wrap"><button class="back" id="adminBack">← 전시관으로 돌아가기</button><h1>전시관 관리자</h1><p class="lead">작품을 추가하거나 수정·삭제하면 서버(Supabase)에 실시간으로 반영됩니다.</p><div class="tools"><button class="btn" id="newWork">+ 새 작품 추가</button></div><div id="editor"></div><h2>등록된 작품 (${W.length})</h2><div class="grid">${W.map(w=>`<div><div class="thumb">${img(w)}</div><h3>${E(w.title)}</h3><small>${E(w.artist_name)}</small><p><button class="chip" data-edit="${w.id}">수정</button> <button class="chip" data-delete="${w.id}">삭제</button></p></div>`).join('')}</div></div></section>`;
 
 const adminBackBtn = document.getElementById('adminBack');
 if(adminBackBtn) adminBackBtn.onclick=()=>{view='home';home()};
 
 const newWorkBtn = document.getElementById('newWork');
 if(newWorkBtn) newWorkBtn.onclick=()=>workForm();
 
 app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>workForm(W.find(w=>String(w.id)===b.dataset.edit)));
 app.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async ()=>{
   if(confirm('이 작품을 정말 삭제할까요?')){
     const deleteId = b.dataset.delete;
     const { error } = await _supabase.from('works').delete().eq('id', deleteId);
     if(error) alert('삭제 실패: ' + error.message);
     else { alert('삭제되었습니다!'); await fetchWorks(); adminPage(); }
   }
 });
}

function workForm(w={id:null,title:'',artist_name:'',category:'캐릭터',tools:'',description:'',intention:'',image_url:''}){
 const editorEl = document.getElementById('editor');
 if(!editorEl) return;
 
 editorEl.innerHTML=`<div style="border:1px solid var(--line);background:var(--surface);padding:20px;border-radius:16px;margin:20px 0"><h2>${w.id?'작품 수정':'새 작품 추가'}</h2><form id="workForm"><p>작품명 <input class="search" name="title" required value="${E(w.title)}"></p><p>공개 작가명 <input class="search" name="artist_name" value="${E(w.artist_name)}"></p><p>분류 <select class="search" name="category">${CATS.filter(c=>c!=='전체').map(c=>`<option ${w.category===c?'selected':''}>${c}</option>`).join('')}</select></p><p>제작 도구 <input class="search" name="tools" value="${E(w.tools)}"></p><p>작품 설명 <textarea class="search" name="description">${E(w.description)}</textarea></p><p>창작 의도 <textarea class="search" name="intention">${E(w.intention)}</textarea></p><p>작품 이미지 <input type="file" id="workImage" accept="image/*"></p>${w.image_url?`<p><img src="${w.image_url}" style="height:80px;border-radius:8px;"></p>`:''}<button class="btn" type="submit">Supabase에 저장</button> <button class="chip" type="button" id="cancelForm">취소</button></form></div>`;
 
 const cancelFormBtn = document.getElementById('cancelForm');
 if(cancelFormBtn) cancelFormBtn.onclick=()=>editorEl.innerHTML='';
 
 const workFormEl = document.getElementById('workForm');
 if(workFormEl) {
   workFormEl.onsubmit=async e=>{
     e.preventDefault();
     const f=e.target;
     let imageUrl = w.image_url || '';
     const workImageInput = document.getElementById('workImage');
     const file = workImageInput ? workImageInput.files[0] : null;

     if(file){
       const fileName = `${Date.now()}_${file.name}`;
       const { data: storageData, error: storageError } = await _supabase.storage.from('images').upload(fileName, file);
       if(storageError){ alert('이미지 업로드 오류: ' + storageError.message); return; }
       const { data: publicData } = _supabase.storage.from('images').getPublicUrl(fileName);
       imageUrl = publicData.publicUrl;
     }

     const payload = {
      title: f.title.value,
      artist_name: f.artist_name.value,
      category: f.category.value,
      tools: f.tools.value,
      description: f.description.value,
      intention: f.intention.value,
      image_url: imageUrl
     };

     if(w.id){
       const { error } = await _supabase.from('works').update(payload).eq('id', w.id);
       if(error) alert('수정 실패: ' + error.message);
       else alert('성공적으로 수정되었습니다!');
     } else {
       const { error } = await _supabase.from('works').insert([payload]);
       if(error) alert('등록 실패: ' + error.message);
       else alert('성공적으로 등록되었습니다!');
     }

     await fetchWorks();
     adminPage();
   }
 }
}

fetchWorks();
applySettings();
</script>
